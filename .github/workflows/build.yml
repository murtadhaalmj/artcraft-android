name: Build PhotoCraft APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install the new PhotoCraft adapter files
        run: |
          test -f photocraft_adapter.rs || { echo "MISSING photocraft_adapter.rs in the repository root"; exit 1; }
          cp photocraft_adapter.rs adapters/photocraft/src/lib.rs
          if [ -f PhotoCraftActivity.java ]; then cp PhotoCraftActivity.java adapters/photocraft/java/com/artcraft/photocraft/PhotoCraftActivity.java; fi
          grep -q "long_press_off" adapters/photocraft/src/lib.rs || { echo "WRONG photocraft_adapter.rs: it is not the new file"; exit 1; }
          head -1 adapters/photocraft/src/lib.rs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Android SDK platform
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: bash build.sh -photocraft -appname="PhotoCraft Keys"
      - uses: actions/upload-artifact@v4
        with:
          name: photocraft-keys-apk
          path: output/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: logs/
